name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build library
        run: pnpm build:lib

      - name: Tree-shake check (dist-lib)
        run: pnpm test:treeshake

      - name: publint
        run: pnpm publint

      - name: Are the types wrong
        run: pnpm attw

      - name: Bundle size budget
        run: pnpm size

      - name: create-app smoke
        run: pnpm test:create-app

      - name: Build showcase
        run: pnpm build

      - name: Generated props are up to date
        run: git diff --exit-code apps/site/src/showcase/registry/generated-props.ts

      - name: Test showcase
        run: pnpm --filter @craftzbay/site test

  # Library peer range is ^18 || ^19 — typecheck + test the library against React 19.
  # React is overridden for the whole workspace in this job (see step below).
  test-react-19:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Override React for the WHOLE workspace: with node-linker=hoisted, adding
      # react@19 only to packages/ui leaves @testing-library/react on a nested
      # react-dom@18 (apps/site pins ^18), which then renders 19-created elements.
      - name: Install React 19 (workspace override)
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.pnpm={...(p.pnpm||{}),overrides:{...((p.pnpm||{}).overrides||{}),react:'19','react-dom':'19','@types/react':'19','@types/react-dom':'19'}};fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          pnpm install --no-frozen-lockfile
          node -p "'react-dom ' + require('react-dom/package.json').version"

      - name: Typecheck (React 19)
        run: pnpm --filter @craftzbay/ui typecheck

      - name: Test (React 19)
        run: pnpm test
