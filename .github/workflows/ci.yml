name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build library
        run: pnpm build:lib

      - name: Tree-shake check (dist-lib)
        run: pnpm test:treeshake

      - name: publint
        run: pnpm publint

      - name: Are the types wrong
        run: pnpm attw

      - name: Bundle size budget
        run: pnpm size

      - name: create-app smoke
        run: pnpm test:create-app

      - name: Build showcase
        run: pnpm build

  # Library peer range is ^18 || ^19 — typecheck + test the library against React 19.
  # Only packages/ui is switched; apps/site stays on React 18 and is not checked here.
  test-react-19:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install React 19 in packages/ui
        run: pnpm --filter @craftzbay/ui add -D react@19 react-dom@19 @types/react@19 @types/react-dom@19 @testing-library/react@16

      - name: Typecheck (React 19)
        run: pnpm --filter @craftzbay/ui typecheck

      - name: Test (React 19)
        run: pnpm test
